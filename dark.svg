<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="480" viewBox="0 0 1200 480"
     xmlns="http://www.w3.org/2000/svg"
     role="img" aria-label="Nikhil Kumar Yadav - Full Stack Developer and AI Enthusiast">

  <defs>
    <style>
      .mono { font-family: "JetBrains Mono","Fira Code","Cascadia Code",Consolas,monospace; }
      .lb { fill:#64748B; font-size:12.5px; }
      .lv { fill:#F1F5F9; font-size:13px; }
      .cy { fill:#22D3EE; }
      .gr { fill:#10B981; }
      .pu { fill:#A78BFA; }
      .or { fill:#FB923C; }
      .pk { fill:#F472B6; }
      .dm { fill:#475569; }
      .mt { fill:#94A3B8; }
      .hd { fill:#F8FAFC; font-size:14px; font-weight:700; letter-spacing:1.8px; }
    </style>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#070D1A"/>
      <stop offset="100%" stop-color="#0D1627"/>
    </linearGradient>
    <linearGradient id="tb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0B1324"/>
    </linearGradient>
    <linearGradient id="rg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#22D3EE"/>
      <stop offset="50%"  stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="hg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Code badge symbols -->
    <g id="s0"><text text-anchor="middle" class="mono cy" font-size="20" font-weight="700" y="6">&lt;/&gt;</text></g>
    <g id="s1"><text text-anchor="middle" class="mono gr" font-size="20" font-weight="700" y="6">{ }</text></g>
    <g id="s2"><text text-anchor="middle" class="mono pu" font-size="20" font-weight="700" y="6">( )</text></g>
    <g id="s3"><text text-anchor="middle" class="mono or" font-size="20" font-weight="700" y="6">[ ]</text></g>
    <g id="s4"><text text-anchor="middle" class="mono pk" font-size="18" font-weight="700" y="6">const</text></g>
    <g id="s5"><text text-anchor="middle" class="mono cy" font-size="18" font-weight="700" y="6">async</text></g>
    <g id="s6"><text text-anchor="middle" class="mono gr" font-size="18" font-weight="700" y="6">React</text></g>
    <g id="s7"><text text-anchor="middle" class="mono pu" font-size="18" font-weight="700" y="6">Node</text></g>
    <g id="s8"><text text-anchor="middle" class="mono or" font-size="16" font-weight="700" y="6">AI Agent</text></g>
    <g id="s9"><text text-anchor="middle" class="mono pk" font-size="16" font-weight="700" y="6">MongoDB</text></g>
  </defs>

  <!-- Window -->
  <rect width="1200" height="480" rx="16" fill="url(#bg)"/>

  <!-- Title bar -->
  <path d="M0 16 a16 16 0 0 1 16-16 h1168 a16 16 0 0 1 16 16 v36 H0 Z" fill="url(#tb)"/>
  <line x1="0" y1="52" x2="1200" y2="52" stroke="#1E293B" stroke-width="1"/>
  <circle cx="26" cy="26" r="6" fill="#FF5F56"/>
  <circle cx="47" cy="26" r="6" fill="#FFBD2E"/>
  <circle cx="68" cy="26" r="6" fill="#27C93F"/>
  <text x="600" y="31" text-anchor="middle" class="mono mt" font-size="12">profile.sh -- nikhil@devbox</text>

  <!-- LIVE dot -->
  <circle cx="1140" cy="26" r="4" fill="#10B981">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="1150" y="31" class="mono gr" font-size="11" font-weight="700" letter-spacing="1">LIVE</text>

  <!-- ===== LEFT: AVATAR ZONE (orbiting code symbols around a portrait frame) ===== -->

  <!-- Outer glow ring — rotates -->
  <circle cx="210" cy="270" r="130" fill="none" stroke="url(#rg)" stroke-width="2" filter="url(#glow)" opacity="0.75">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2.6s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" from="0 210 270" to="360 210 270" dur="13s" repeatCount="indefinite"/>
  </circle>

  <!-- Dashed counter-ring -->
  <circle cx="210" cy="270" r="142" fill="none" stroke="#1E3A5F" stroke-width="1" stroke-dasharray="7 5" opacity="0.6">
    <animateTransform attributeName="transform" type="rotate" from="360 210 270" to="0 210 270" dur="19s" repeatCount="indefinite"/>
  </circle>

  <!-- Portrait background circle -->
  <circle cx="210" cy="270" r="115" fill="#0B1A2E" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Abstract developer silhouette (geometric) -->
  <!-- Head circle -->
  <circle cx="210" cy="218" r="38" fill="none" stroke="url(#hg)" stroke-width="2" opacity="0.9"/>
  <circle cx="210" cy="218" r="20" fill="#0D1F35" stroke="url(#hg)" stroke-width="1.5" opacity="0.7"/>
  <!-- Shoulders arc -->
  <path d="M 130 330 Q 130 285 210 280 Q 290 285 290 330" fill="none" stroke="url(#rg)" stroke-width="2.5" opacity="0.85"/>
  <!-- Body block -->
  <rect x="175" y="280" width="70" height="50" rx="8" fill="#0D1F35" stroke="url(#hg)" stroke-width="1.5" opacity="0.7"/>

  <!-- Initials on body -->
  <text x="210" y="313" text-anchor="middle" class="mono" fill="url(#hg)" font-size="18" font-weight="700" letter-spacing="3">NKY</text>

  <!-- Portrait border ring -->
  <circle cx="210" cy="270" r="115" fill="none" stroke="url(#rg)" stroke-width="2"/>

  <!-- ===== 8 ORBITING BADGE PANELS (radius 142) ===== -->
  <g transform="translate(210,270)">

    <!-- 0deg: cycles s0 -> s4 -->
    <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="13s" repeatCount="indefinite"/>
      <g transform="translate(0,-142)">
        <rect x="-28" y="-14" width="56" height="26" rx="6" fill="#0B1220" stroke="#22D3EE" stroke-width="1.2" opacity="0.9"/>
        <g opacity="1"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="6s" repeatCount="indefinite" begin="0s"/><use href="#s0"/></g>
        <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.45;0.5;0.95;1" dur="6s" repeatCount="indefinite" begin="0s"/><use href="#s4"/></g>
      </g>
    </g>

    <!-- 45deg: s1 -> s5 -->
    <g><animateTransform attributeName="transform" type="rotate" from="45" to="405" dur="13s" repeatCount="indefinite"/>
      <g transform="translate(0,-142)">
        <rect x="-28" y="-14" width="56" height="26" rx="6" fill="#0B1220" stroke="#10B981" stroke-width="1.2" opacity="0.9"/>
        <g opacity="1"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="6s" repeatCount="indefinite" begin="0.75s"/><use href="#s1"/></g>
        <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.45;0.5;0.95;1" dur="6s" repeatCount="indefinite" begin="0.75s"/><use href="#s5"/></g>
      </g>
    </g>

    <!-- 90deg: s2 -> s6 -->
    <g><animateTransform attributeName="transform" type="rotate" from="90" to="450" dur="13s" repeatCount="indefinite"/>
      <g transform="translate(0,-142)">
        <rect x="-28" y="-14" width="56" height="26" rx="6" fill="#0B1220" stroke="#A78BFA" stroke-width="1.2" opacity="0.9"/>
        <g opacity="1"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="6s" repeatCount="indefinite" begin="1.5s"/><use href="#s2"/></g>
        <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.45;0.5;0.95;1" dur="6s" repeatCount="indefinite" begin="1.5s"/><use href="#s6"/></g>
      </g>
    </g>

    <!-- 135deg: s3 -> s7 -->
    <g><animateTransform attributeName="transform" type="rotate" from="135" to="495" dur="13s" repeatCount="indefinite"/>
      <g transform="translate(0,-142)">
        <rect x="-28" y="-14" width="56" height="26" rx="6" fill="#0B1220" stroke="#FB923C" stroke-width="1.2" opacity="0.9"/>
        <g opacity="1"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="6s" repeatCount="indefinite" begin="2.25s"/><use href="#s3"/></g>
        <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.45;0.5;0.95;1" dur="6s" repeatCount="indefinite" begin="2.25s"/><use href="#s7"/></g>
      </g>
    </g>

    <!-- 180deg: s8 -> s0 -->
    <g><animateTransform attributeName="transform" type="rotate" from="180" to="540" dur="13s" repeatCount="indefinite"/>
      <g transform="translate(0,-142)">
        <rect x="-36" y="-14" width="72" height="26" rx="6" fill="#0B1220" stroke="#F472B6" stroke-width="1.2" opacity="0.9"/>
        <g opacity="1"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="6s" repeatCount="indefinite" begin="3s"/><use href="#s8"/></g>
        <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.45;0.5;0.95;1" dur="6s" repeatCount="indefinite" begin="3s"/><use href="#s0"/></g>
      </g>
    </g>

    <!-- 225deg: s9 -> s1 -->
    <g><animateTransform attributeName="transform" type="rotate" from="225" to="585" dur="13s" repeatCount="indefinite"/>
      <g transform="translate(0,-142)">
        <rect x="-36" y="-14" width="72" height="26" rx="6" fill="#0B1220" stroke="#22D3EE" stroke-width="1.2" opacity="0.9"/>
        <g opacity="1"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="6s" repeatCount="indefinite" begin="3.75s"/><use href="#s9"/></g>
        <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.45;0.5;0.95;1" dur="6s" repeatCount="indefinite" begin="3.75s"/><use href="#s1"/></g>
      </g>
    </g>

    <!-- 270deg: s5 -> s8 -->
    <g><animateTransform attributeName="transform" type="rotate" from="270" to="630" dur="13s" repeatCount="indefinite"/>
      <g transform="translate(0,-142)">
        <rect x="-28" y="-14" width="56" height="26" rx="6" fill="#0B1220" stroke="#10B981" stroke-width="1.2" opacity="0.9"/>
        <g opacity="1"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="6s" repeatCount="indefinite" begin="4.5s"/><use href="#s5"/></g>
        <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.45;0.5;0.95;1" dur="6s" repeatCount="indefinite" begin="4.5s"/><use href="#s8"/></g>
      </g>
    </g>

    <!-- 315deg: s6 -> s2 -->
    <g><animateTransform attributeName="transform" type="rotate" from="315" to="675" dur="13s" repeatCount="indefinite"/>
      <g transform="translate(0,-142)">
        <rect x="-28" y="-14" width="56" height="26" rx="6" fill="#0B1220" stroke="#A78BFA" stroke-width="1.2" opacity="0.9"/>
        <g opacity="1"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="6s" repeatCount="indefinite" begin="5.25s"/><use href="#s6"/></g>
        <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.45;0.5;0.95;1" dur="6s" repeatCount="indefinite" begin="5.25s"/><use href="#s2"/></g>
      </g>
    </g>

  </g>

  <!-- Label below avatar -->
  <text x="210" y="408" text-anchor="middle" class="mono" fill="url(#hg)" font-size="13" font-weight="700" letter-spacing="2">N I K H I L</text>
  <text x="210" y="424" text-anchor="middle" class="mono mt" font-size="9.5" letter-spacing="1.5">FULL STACK  |  AI  |  OSS</text>

  <!-- Divider -->
  <line x1="370" y1="68" x2="370" y2="458" stroke="#1E293B" stroke-width="1"/>

  <!-- ===== RIGHT: TERMINAL OUTPUT ===== -->
  <g class="mono" transform="translate(398,0)">
    <text x="0" y="80" class="mt" font-size="12.5">nikhil@devbox <tspan class="gr">~</tspan> $ ./profile.sh --live</text>
    <text x="0" y="97" class="dm" font-size="11.5">&gt; loading identity...</text>

    <!-- IDENTITY -->
    <text x="0" y="126" class="hd" fill="url(#hg)">IDENTITY</text>
    <line x1="0" y1="133" x2="780" y2="133" stroke="#1E293B" stroke-width="1"/>
    <g font-size="13">
      <text x="0" y="153"><tspan class="lb">name     </tspan><tspan x="106" class="lv">Nikhil Kumar Yadav</tspan></text>
      <text x="0" y="172"><tspan class="lb">role     </tspan><tspan x="106" class="cy">Full Stack Developer  |  AI Enthusiast</tspan></text>
      <text x="0" y="191"><tspan class="lb">edu      </tspan><tspan x="106" class="lv">B.Tech CSE  ·  LPU  ·  2023 - 2027</tspan></text>
      <text x="0" y="210"><tspan class="lb">location </tspan><tspan x="106" class="lv">Punjab, India</tspan></text>
      <text x="0" y="229"><tspan class="lb">email    </tspan><tspan x="106" class="lv">ny186871@gmail.com</tspan></text>
      <text x="0" y="248"><tspan class="lb">github   </tspan><tspan x="106" class="cy">@Nikh1lXDev</tspan></text>
      <text x="0" y="267"><tspan class="lb">status   </tspan><tspan x="106" class="gr">&#x25CF; </tspan><tspan class="lv">building  ·  shipping  ·  open-source</tspan></text>
    </g>

    <!-- FOCUS -->
    <text x="0" y="298" class="hd" fill="url(#hg)">FOCUS[]</text>
    <line x1="0" y1="305" x2="780" y2="305" stroke="#1E293B" stroke-width="1"/>
    <text x="0" y="323" font-size="12.5" class="mt">fullstack  ·  ai-engineering  ·  mern  ·  dsa  ·  system-design  ·  devops  ·  oss</text>

    <!-- TOOLCHAIN -->
    <text x="0" y="353" class="hd" fill="url(#hg)">TOOLCHAIN</text>
    <line x1="0" y1="360" x2="780" y2="360" stroke="#1E293B" stroke-width="1"/>
    <g font-size="12.5">
      <text x="0" y="378"><tspan class="lb">lang   </tspan><tspan x="75" class="lv">C++  ·  JavaScript  ·  Python  ·  SQL</tspan></text>
      <text x="0" y="396"><tspan class="lb">front  </tspan><tspan x="75" class="cy">React  ·  Next.js  ·  Tailwind CSS</tspan></text>
      <text x="0" y="414"><tspan class="lb">back   </tspan><tspan x="75" class="gr">Node.js  ·  Express  ·  Socket.io</tspan></text>
      <text x="0" y="432"><tspan class="lb">ai     </tspan><tspan x="75" class="pu">LangGraph  ·  Gemini  ·  RAG  ·  LLMs</tspan></text>
      <text x="0" y="450"><tspan class="lb">ops    </tspan><tspan x="75" class="or">Docker  ·  GitHub Actions  ·  Vercel</tspan></text>
    </g>

    <!-- Blinking cursor -->
    <rect x="0" y="458" width="8" height="14" fill="#22D3EE">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

</svg>