<?xml version="1.0" encoding="UTF-8"?>
<svg width="1180" height="610" viewBox="0 0 1180 610" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-labelledby="titleDark descDark">
  <title id="titleDark">Nikhil Kumar Yadav — profile.sh --live (dark)</title>
  <desc id="descDark">Terminal-style animated developer profile banner, dark mode</desc>

  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono','Fira Code','SFMono-Regular','Cascadia Code',Consolas,Menlo,monospace; }
      .label { fill:#64748B; font-size:14px; letter-spacing:.5px; }
      .val   { fill:#F8FAFC; font-size:14.5px; }
      .accentCyan { fill:#22D3EE; }
      .accentGreen { fill:#10B981; }
      .accentPurple { fill:#A78BFA; }
      .secText { fill:#94A3B8; }
      .heading { fill:#F8FAFC; font-size:16px; font-weight:700; letter-spacing:1.5px; }
      .caption { fill:#64748B; font-size:10.5px; letter-spacing:1.5px; }
      .dim { fill:#475569; }
    </style>

    <linearGradient id="winBgD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220" stop-opacity="0.94"/>
      <stop offset="100%" stop-color="#0A101F" stop-opacity="0.98"/>
    </linearGradient>

    <linearGradient id="titleBarD" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0B1324"/>
    </linearGradient>

    <linearGradient id="ringGradD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="55%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <radialGradient id="avatarBgD" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#132038"/>
      <stop offset="100%" stop-color="#0A101F"/>
    </radialGradient>

    <linearGradient id="headGradD" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>

    <filter id="glowD" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="avatarClipD">
      <rect x="90" y="112" width="300" height="300" rx="22"/>
    </clipPath>

    <!-- reusable tech glyphs -->
    <g id="iconReact">
      <g fill="none" stroke="#22D3EE" stroke-width="2.4">
        <ellipse cx="0" cy="0" rx="30" ry="12"/>
        <ellipse cx="0" cy="0" rx="30" ry="12" transform="rotate(60)"/>
        <ellipse cx="0" cy="0" rx="30" ry="12" transform="rotate(120)"/>
      </g>
      <circle cx="0" cy="0" r="5" fill="#22D3EE"/>
    </g>
    <g id="iconNode">
      <path d="M0 -28 L24 -14 L24 14 L0 28 L-24 14 L-24 -14 Z" fill="none" stroke="#10B981" stroke-width="2.4"/>
      <text x="0" y="6" text-anchor="middle" class="mono" font-size="16" fill="#10B981" font-weight="700">N</text>
    </g>
    <g id="iconMongo">
      <path d="M0 -30 C 18 -14, 18 16, 0 30 C -18 16, -18 -14, 0 -30 Z" fill="none" stroke="#10B981" stroke-width="2.4"/>
      <line x1="0" y1="18" x2="0" y2="32" stroke="#10B981" stroke-width="2.4"/>
    </g>
    <g id="iconDocker">
      <g fill="none" stroke="#22D3EE" stroke-width="2.4">
        <rect x="-26" y="-6" width="14" height="14" rx="2"/>
        <rect x="-8" y="-6" width="14" height="14" rx="2"/>
        <rect x="10" y="-6" width="14" height="14" rx="2"/>
        <rect x="-8" y="-22" width="14" height="14" rx="2"/>
      </g>
      <path d="M-32 14 Q0 30 32 14" fill="none" stroke="#22D3EE" stroke-width="2.4"/>
    </g>
    <g id="iconCode">
      <text x="0" y="8" text-anchor="middle" class="mono" font-size="26" fill="#A78BFA" font-weight="700">&lt;/&gt;</text>
    </g>
  </defs>

  <!-- window -->
  <rect x="20" y="20" width="1140" height="570" rx="20" fill="url(#winBgD)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- title bar -->
  <path d="M20 40 a20 20 0 0 1 20-20 h1080 a20 20 0 0 1 20 20 v34 h-1120 Z" fill="url(#titleBarD)"/>
  <line x1="20" y1="94" x2="1160" y2="94" stroke="#1E293B" stroke-width="1"/>

  <circle cx="48" cy="57" r="6.5" fill="#FF5F56"/>
  <circle cx="70" cy="57" r="6.5" fill="#FFBD2E"/>
  <circle cx="92" cy="57" r="6.5" fill="#27C93F"/>

  <text x="590" y="62" text-anchor="middle" class="mono secText" font-size="14">profile.sh --live</text>

  <g transform="translate(1078,50)">
    <circle cx="0" cy="7" r="4.5" fill="#10B981">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="12" y="12" class="mono accentGreen" font-size="12" font-weight="700" letter-spacing="1">LIVE</text>
  </g>

  <!-- subtle scanlines -->
  <g opacity="0.05">
    <line x1="20" y1="120" x2="1160" y2="120" stroke="#22D3EE" stroke-width="1"/>
    <line x1="20" y1="220" x2="1160" y2="220" stroke="#22D3EE" stroke-width="1"/>
    <line x1="20" y1="320" x2="1160" y2="320" stroke="#22D3EE" stroke-width="1"/>
    <line x1="20" y1="420" x2="1160" y2="420" stroke="#22D3EE" stroke-width="1"/>
    <line x1="20" y1="520" x2="1160" y2="520" stroke="#22D3EE" stroke-width="1"/>
  </g>

  <!-- ============ LEFT: PORTRAIT + LOGO MORPH ============ -->
  <g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="1s" fill="freeze"/>

      <rect x="86" y="108" width="308" height="308" rx="26" fill="none" stroke="url(#ringGradD)" stroke-width="2" filter="url(#glowD)">
        <animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="2.6s" repeatCount="indefinite"/>
      </rect>

      <rect x="90" y="112" width="300" height="300" rx="22" fill="url(#avatarBgD)"/>

      <g clip-path="url(#avatarClipD)">
        <g opacity="0.55">
          <line x1="90" y1="182" x2="390" y2="182" stroke="#1E293B" stroke-width="1"/>
          <line x1="90" y1="252" x2="390" y2="252" stroke="#1E293B" stroke-width="1"/>
          <line x1="90" y1="322" x2="390" y2="322" stroke="#1E293B" stroke-width="1"/>
          <line x1="90" y1="392" x2="390" y2="392" stroke="#1E293B" stroke-width="1"/>
        </g>
        <!-- abstract identity mark — placeholder until a real photo is supplied for dithering -->
        <g transform="translate(240,262)">
          <circle r="70" fill="none" stroke="url(#headGradD)" stroke-width="2" opacity="0.7"/>
          <path d="M-46 46 C -46 -4, -18 -34, 0 -34 C 18 -34, 46 -4, 46 46" fill="none" stroke="url(#headGradD)" stroke-width="2.4"/>
          <circle cx="0" cy="-8" r="26" fill="none" stroke="url(#headGradD)" stroke-width="2.4"/>
          <text x="0" y="98" text-anchor="middle" class="mono" font-size="12" fill="#475569" letter-spacing="2">N.K.YADAV</text>
        </g>
      </g>

      <rect x="90" y="112" width="300" height="300" rx="22" fill="none" stroke="#1E293B" stroke-width="1"/>

      <!-- connector to morph badge -->
      <line x1="240" y1="412" x2="240" y2="446" stroke="#334155" stroke-width="2"/>

      <!-- logo morph badge -->
      <circle cx="240" cy="470" r="34" fill="#0A101F" stroke="url(#ringGradD)" stroke-width="1.5"/>
      <g transform="translate(240,470)">
        <g opacity="0"><use href="#iconReact" transform="scale(0.62)"/>
          <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.18;0.22;1" dur="5s" begin="0s" repeatCount="indefinite"/>
        </g>
        <g opacity="0"><use href="#iconNode" transform="scale(0.62)"/>
          <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.18;0.22;1" dur="5s" begin="1s" repeatCount="indefinite"/>
        </g>
        <g opacity="0"><use href="#iconMongo" transform="scale(0.62)"/>
          <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.18;0.22;1" dur="5s" begin="2s" repeatCount="indefinite"/>
        </g>
        <g opacity="0"><use href="#iconDocker" transform="scale(0.62)"/>
          <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.18;0.22;1" dur="5s" begin="3s" repeatCount="indefinite"/>
        </g>
        <g opacity="0"><use href="#iconCode" transform="scale(0.62)"/>
          <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.18;0.22;1" dur="5s" begin="4s" repeatCount="indefinite"/>
        </g>
      </g>

      <text x="240" y="524" text-anchor="middle" class="mono caption">REACT → NODE → MONGODB → DOCKER → CODE</text>
    </g>
  </g>

  <!-- divider -->
  <line x1="440" y1="112" x2="440" y2="580" stroke="#1E293B" stroke-width="1"/>

  <!-- ============ RIGHT: SYSTEM.INFO TERMINAL OUTPUT ============ -->
  <g class="mono" transform="translate(472,0)">
    <text x="0" y="118" class="secText" font-size="13.5">nikhil@devbox <tspan class="accentGreen">~</tspan> $ ./profile.sh --live</text>
    <text x="0" y="138" class="dim" font-size="12.5">&gt; loading identity...</text>

    <text x="0" y="172" class="heading" fill="url(#headGradD)">IDENTITY</text>
    <line x1="0" y1="180" x2="668" y2="180" stroke="#1E293B" stroke-width="1"/>

    <g font-size="14">
      <text x="0" y="204"><tspan class="label">name</tspan><tspan x="112" class="val">Nikhil Kumar Yadav</tspan></text>
      <text x="0" y="226"><tspan class="label">role</tspan><tspan x="112" class="val">Full Stack Developer</tspan></text>
      <text x="0" y="248"><tspan class="label">edu</tspan><tspan x="112" class="val">B.Tech CSE · LPU · 2023–2027</tspan></text>
      <text x="0" y="270"><tspan class="label">location</tspan><tspan x="112" class="val">Punjab, India</tspan></text>
      <text x="0" y="292"><tspan class="label">email</tspan><tspan x="112" class="val">ny186871@gmail.com</tspan></text>
      <text x="0" y="314"><tspan class="label">github</tspan><tspan x="112" class="accentCyan">@Nikh1lXDev</tspan></text>
      <text x="0" y="336">
        <tspan class="label">status</tspan>
        <tspan x="112" class="accentGreen">●</tspan>
        <tspan class="val"> building · learning · shipping · open-source</tspan>
      </text>
    </g>

    <text x="0" y="368" class="heading" fill="url(#headGradD)">FOCUS[]</text>
    <line x1="0" y1="376" x2="668" y2="376" stroke="#1E293B" stroke-width="1"/>
    <text x="0" y="398" font-size="13.5" class="secText">fullstack · ai · mern · dsa · algorithms · system-design · devops · oss</text>

    <text x="0" y="430" class="heading" fill="url(#headGradD)">TOOLCHAIN</text>
    <line x1="0" y1="438" x2="668" y2="438" stroke="#1E293B" stroke-width="1"/>
    <g font-size="13.5">
      <text x="0" y="460"><tspan class="label">lang</tspan><tspan x="86" class="val">C++ · JavaScript · Python · SQL</tspan></text>
      <text x="0" y="482"><tspan class="label">front</tspan><tspan x="86" class="val">React · HTML5 · CSS3 · Tailwind</tspan></text>
      <text x="0" y="504"><tspan class="label">back</tspan><tspan x="86" class="val">Node.js · Express.js</tspan></text>
      <text x="0" y="526"><tspan class="label">data</tspan><tspan x="86" class="val">MongoDB · MySQL</tspan></text>
      <text x="0" y="548"><tspan class="label">ops</tspan><tspan x="86" class="val">Docker · GitHub Actions · Vercel</tspan></text>
    </g>

    <g transform="translate(0,565)">
      <rect x="0" y="-12" width="9" height="15" class="accentCyan">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
